html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}

.bar i{display:block;height:100%;transition:width .4s}
#ebar{background:var(--acc)}#pbar{background:var(--ok)}
.stage{text-align:center;padding:8px 0}
#em{font-size:88px;line-height:1.1;display:inline-block}
.hit{animation:sh .3s}

#msg{min-height:44px;text-align:center;font-weight:700;font-size:16px}
#q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px;font-weight:600}
#opts{display:flex;flex-direction:column;gap:8px}
button{min-height:52px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-family:inherit}
button:active{transform:scale(.98)}
button:disabled{opacity:.6}
.big{background:var(--acc);color:#fff;border:none;font-weight:700}
</style>

const ITEMS=[
{id:"heal",n:"🩹 応急処置",d:"HP+40"},
{id:"reroll",n:"🔄 引き直し券",d:"選択肢の引き直し+1回"},
{id:"boost",n:"🔥 大キャンペーン",d:"次の攻撃が1.5倍"},
{id:"barrier",n:"🛡️ 防災バリア",d:"次に受けるダメージ半減"},
{id:"flash",n:"✨ 閃光のブローチ【レア】",d:"次のクイズに正解で攻撃を完全回避"},
{id:"tax",n:"📄 確定申告の書類【レア】",d:"次のクイズの選択肢が2つになる"}
];
const asked=new Set();
let MAXP=150;
const DIFF=[{n:"🟢 初級",hp:200,max:999,inv:3},{n:"🟡 中級",hp:150,max:100,inv:3},{n:"🔴 上級",hp:100,max:85,inv:3},{n:"👹 鬼級",hp:70,oni:1,inv:1}];
const tier=x=>C[x].hp<=80?1:C[x].hp<=100?2:3;
const eligible=d=>ALL.filter(k=>d.oni?!!C[k].oni:(!C[k].oni&&C[k].hp<=d.max));
let diff=0;
const $=id=>document.getElementById(id);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const dmg=(a,b,i)=>Math.max(3,Math.min(100,Math.round(40*Math.pow(C[a].s[i]/C[b].s[i],EXP[i]))));
const fmt=(c,i)=>C[c].s[i]+U[i];
let me,order,ei,en,ehp,php,lock,cur=[],rerolls=1,inv=[],boost=false,barrier=false,flash=false,tax=false;
function btns(list,fn,grid){const o=$("opts");o.innerHTML="";o.style.cssText=grid?"display:grid;grid-template-columns:1fr 1fr;gap:8px":"";list.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>fn(i);o.appendChild(b)});}
function bars(){$("pbar").style.width=Math.max(0,php)/MAXP*100+"%";$("php").textContent="HP "+Math.max(0,php);if(en){$("ebar").style.width=Math.max(0,ehp)/C[en].hp*100+"%";$("ehp").textContent="HP "+Math.max(0,ehp);}}
function shake(){const em=$("em");em.classList.remove("hit");void em.offsetWidth;em.classList.add("hit");}
function select(){
  en=null;php=MAXP;me=null;
  $("pn").textContent="あなた";$("pbar").style.width="100%";$("php").textContent="";
  $("em").textContent="🏙️";$("en").textContent="";$("ehp").textContent="";$("ebar").style.width="0";
  $("msg").textContent="";$("q").textContent="難易度を選ぼう";
  btns(DIFF.map(d=>d.n+"（HP"+d.hp+"・"+eligible(d).length+"都市から選べる）"),i=>{diff=i;pickCity();});
}
function pickCity(){
  $("q").textContent=DIFF[diff].n+"：どの都市で戦う？";
  const L=eligible(DIFF[diff]);
  btns(L.map(k=>C[k].e+" "+k).concat(["← 難易度にもどる"]),i=>i<L.length?start(L[i]):select(),true);
}
function start(k){
  me=k;const T=n=>shuf(ALL.filter(x=>x!==k&&tier(x)===n));order=[...T(1).slice(0,2),...T(2).slice(0,2),...T(3).slice(0,1)];
  asked.clear();ei=0;MAXP=DIFF[diff].hp;php=MAXP;rerolls=1;inv=[];boost=false;barrier=false;flash=false;tax=false;
  $("pn").textContent=C[k].e+" "+k;spawn();
}
function spawn(){en=order[ei];ehp=C[en].hp;$("em").textContent=C[en].e;$("en").textContent=en+"（"+(ei+1)+"/"+order.length+"）"+(ei===order.length-1?" 👑ボス":"");$("msg").textContent=en+"があらわれた！";turnP();}
function draw(){const all=[...Array(M.length).keys()];const pool=all.filter(i=>!cur.includes(i));cur=shuf(pool.length>=3?pool:all).slice(0,3);}
function turnP(){cur=[];draw();showP();}
function showP(){
  lock=false;bars();$("q").textContent=en+"に、どの指標で攻める？";
  btns(cur.map(i=>M[i]+"で攻める"),k=>pickP(cur[k]));
  const o=$("opts");
  if(rerolls>0){const r=document.createElement("button");r.textContent="🔄 選択肢を引き直す（残り"+rerolls+"回）";r.style.fontSize="14px";r.onclick=()=>{if(lock)return;rerolls--;draw();showP();};o.appendChild(r);}
  inv.forEach((it,idx)=>{const b=document.createElement("button");b.textContent="🎒 "+it.n+"を使う（"+it.d+"）";b.style.fontSize="14px";b.onclick=()=>useItem(idx);o.appendChild(b);});
}
function useItem(idx){
  if(lock)return;
  const it=inv.splice(idx,1)[0];
  if(it.id==="heal")php=Math.min(MAXP,php+40);
  if(it.id==="reroll")rerolls++;
  if(it.id==="boost")boost=true;
  if(it.id==="barrier")barrier=true;
  if(it.id==="flash")flash=true;
  if(it.id==="tax")tax=true;
  showP();$("msg").textContent=it.n+"を使った！ "+it.d;
}
function pickP(i){
  if(lock)return;lock=true;
  document.querySelectorAll("#opts button").forEach(x=>x.disabled=true);
  let d=dmg(me,en,i);const bo=boost;if(bo){d=Math.round(d*1.5);boost=false;}
  ehp-=d;
  const l=d>=70?"効果バツグン！":d>=40?"まずまず！":d>=15?"いまいち…":"ほとんど効かない…";
  $("msg").textContent=l+(bo?"（🔥1.5倍）":"")+"　"+me+" "+fmt(me,i)+" vs "+en+" "+fmt(en,i)+" → "+d+"ダメージ";
  shake();bars();
  setTimeout(()=>{
    if(ehp<=0){
      if(ei===order.length-1)return end(true);
      return reward();
    }
    turnE();
  },1800);
}
function reward(){
  php=Math.min(MAXP,php+30);bars();
  if(inv.length>=DIFF[diff].inv){$("msg").textContent=en+"をたおした！ HP+30（持ち物がいっぱいで戦利品なし）";ei++;setTimeout(spawn,1500);return;}
  const rs=shuf(ITEMS.filter(x=>(x.id!=="flash"&&x.id!=="tax")||Math.random()<0.2)).slice(0,3);
  $("msg").textContent=en+"をたおした！ HP+30";
  $("q").textContent="戦利品を1つ選ぼう";
  btns(rs.map(r=>r.n+"（"+r.d+"）"),k=>{inv.push(rs[k]);ei++;spawn();});
}
function turnE(){
  const i=Math.floor(Math.random()*M.length);
  let pl=QZ[en].filter(x=>!asked.has(x[0]));if(!pl.length){QZ[en].forEach(x=>asked.delete(x[0]));pl=QZ[en];}const q=pl[Math.floor(Math.random()*pl.length)];asked.add(q[0]);
  let opts=shuf(q[1].map((t,k)=>[t,k===q[2]]));if(tax){const c=opts.find(o=>o[1]),w=shuf(opts.filter(o=>!o[1]));opts=shuf([c,w[0]]);tax=false;}
  lock=false;
  $("msg").textContent=en+"の「"+M[i]+"」攻撃！ クイズに正解してダメージを減らせ！";
  $("q").textContent=q[0];
  btns(opts.map(o=>o[0]),k=>ansE(opts[k][1],i,q[1][q[2]]));
}
function ansE(ok,i,ans){
  if(lock)return;lock=true;
  document.querySelectorAll("#opts button").forEach(x=>x.disabled=true);
  let d=Math.round(dmg(en,me,i)*0.5);if(ok)d=Math.round(d/2);
  const ba=barrier;if(ba){d=Math.round(d/2);barrier=false;}
  d=Math.max(2,d);const fl=flash&&ok;if(flash)flash=false;if(fl)d=0;php-=d;
  $("msg").textContent=(ok?"正解！ ダメージ半減　":"不正解…（答え："+ans+"）　")+(ba?"🛡️バリア！ ":"")+(fl?"✨閃光で完全回避！ ":"")+en+" "+fmt(en,i)+" vs "+me+" "+fmt(me,i)+" → "+d+"ダメージ";
  shake();bars();
  setTimeout(()=>{if(php<=0)end(false);else turnP();},1800);
}
function end(win){
  $("em").textContent=win?"🏆":"😵";
  $("q").textContent=win?me+"で全ての都市をたおした！クリア！":"やられてしまった…";
  $("msg").textContent="";
  const o=$("opts");o.innerHTML="";o.style.cssText="";
  const b=document.createElement("button");b.className="big";b.textContent="もう一度あそぶ";b.onclick=select;o.appendChild(b);
}
select();
</script>
