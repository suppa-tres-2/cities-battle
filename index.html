<style>
:root{--bg:#f6f4ee;--fg:#1d1d1b;--card:#fff;--line:#d8d4c8;--acc:#c0392b;--ok:#2e8b57;--sub:#6b675c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--fg:#eeeeee;--card:#23252b;--line:#3a3d45;--acc:#ff6b5b;--ok:#5fd08e;--sub:#9a9ca4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181c;--fg:#eeeeee;--card:#23252b;--line:#3a3d45;--acc:#ff6b5b;--ok:#5fd08e;--sub:#9a9ca4;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:4px}
.bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .4s}
#ebar{background:var(--acc)}#pbar{background:var(--ok)}
.stage{text-align:center;padding:8px 0}
#em{font-size:88px;line-height:1.1;display:inline-block}
.hit{animation:sh .3s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#msg{min-height:44px;text-align:center;font-weight:700;font-size:16px}
#q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px;font-weight:600}
#opts{display:flex;flex-direction:column;gap:8px}
button{min-height:52px;font-size:16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-family:inherit}
button:active{transform:scale(.98)}
.mini{min-height:36px;font-size:13px;padding:0 12px;align-self:flex-end}
.danger{border:2px solid var(--acc);color:var(--acc);font-weight:700;animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--acc)}50%{box-shadow:0 0 16px var(--acc)}}
button:disabled{opacity:.6}
.big{background:var(--acc);color:#fff;border:none;font-weight:700}
</style>
</head>

/* ---- BGM（バトル風・ブラウザ内で生成） ---- */
const CH=[[220,261.63,329.63,440],[174.61,220,261.63,349.23],[196,246.94,293.66,392],[164.81,207.65,246.94,329.63]];
const ARP=[0,1,2,3,2,1,2,3,0,1,2,3,2,1,3,2];
let ac,master,noiseBuf,timer,mstep=0,nextT=0,bgmOn=false;
function tone(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);g.gain.setValueAtTime(0.9,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.2);}
function noise(t,d,v,hp){const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=hp;const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+0.02);}
function playMenu(s,t){
  const bar=Math.floor(s/16)%4,i=s%16,ch=CH[bar];
  if(i%2===0)tone(ch[0]/(i%4===0?2:1),t,0.09,"sawtooth",0.16);
  tone(ch[ARP[i]]*(bar===3&&i>=8?2:1),t,0.08,"square",0.06);
  if(i===0||i===8||i===10)kick(t);
  if(i===4||i===12)noise(t,0.12,0.5,1500);
  if(i%2===0)noise(t,0.04,i%4===2?0.22:0.12,7000);
}
const BCH=[[146.83,174.61,220,293.66],[116.54,146.83,174.61,233.08],[130.81,164.81,196,261.63],[110,138.59,164.81,220]];
const MEL1=[3,-1,2,3,-1,3,2,1,2,-1,3,2,-1,1,2,3],MEL2=[3,-1,3,2,3,-1,2,0,3,-1,2,3,-1,2,1,0];
function playBattle(s,t){
  const bar=Math.floor(s/16)%4,i=s%16,ch=BCH[bar];
  if(i%2===0)tone(i%8===6?ch[0]:ch[0]/2,t,0.08,"sawtooth",0.15);
  tone(ch[i%4],t,0.07,"sawtooth",0.035);
  const m=(bar<2?MEL1:MEL2)[i];
  if(m>=0)tone(ch[m]*2,t,0.1,"square",0.07);
  if(i%4===0||(i===14&&bar%2===1))kick(t);
  if(i===4||i===12)noise(t,0.13,0.55,1500);
  noise(t,0.03,i%4===2?0.2:0.1,7000);
}
function playGeo(s,t){
  const bar=Math.floor(s/16)%4,i=s%16,R=[82.41,82.41,87.31,61.74][bar];
  tone(i%4===0?R*2:R,t,0.07,"sawtooth",i%4===0?0.17:0.11);
  if(i%4===0)tone(1800,t,0.025,"square",0.05);
  if(i%2===1)noise(t,0.02,0.06,9000);
  if(i===0||i===3||(bar>=2&&(i===8||i===11)))kick(t);
  if(i===0&&bar%2===0){tone(R*4,t,0.35,"sawtooth",0.06);tone(R*4*1.4142,t,0.35,"sawtooth",0.05);}
  if(bar>=1&&i>=8)tone(i%2===0?987.77:932.33,t,0.07,"square",bar===3?0.03+i*0.004:0.04);
  if(bar<3&&(i===4||i===12))noise(t,0.1,0.35,1500);
  if(bar===3&&i>=8)noise(t,0.05,0.15+(i-8)*0.04,2000);
}
const TRACKS={menu:{len:0.1,play:playMenu},battle:{len:0.088,play:playBattle},geo:{len:0.083,play:playGeo},none:{len:0.1,play:()=>{}}};
function sweep(f1,f2,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.02);}
function sndOn(){return ac&&bgmOn;}
function seHit(d){if(!sndOn())return;const t=ac.currentTime+0.1;noise(t,0.15,d>=70?0.7:0.45,600);sweep(d>=70?500:300,60,t,0.18,"sawtooth",0.25);if(d>=70)tone(1200,t+0.05,0.12,"square",0.1);}
function seHurt(d){if(!sndOn())return;const t=ac.currentTime+0.1;if(d<=0){tone(1568,t,0.1,"sine",0.15);tone(2093,t+0.07,0.2,"sine",0.12);return;}noise(t,0.2,0.5,300);sweep(220,50,t,0.3,"square",0.2);}
function seDown(){if(!sndOn())return;const t=ac.currentTime;[784,988,1319].forEach((f,i)=>tone(f,t+i*0.08,0.18,"square",0.1));}
function jingleWin(){if(!sndOn())return;const t=ac.currentTime+0.1;[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.14,0.25,"square",0.12));[1046.5,1318.5,1568].forEach(f=>tone(f,t+0.7,0.9,"square",0.08));tone(130.81,t+0.7,0.9,"sawtooth",0.14);tone(2093,t+1.0,0.5,"triangle",0.1);}
function jingleLose(){if(!sndOn())return;const t=ac.currentTime+0.1;[440,392,349.23,293.66].forEach((f,i)=>tone(f,t+i*0.35,0.5,"triangle",0.2));tone(110,t+1.4,1.2,"sawtooth",0.14);tone(103.83,t+1.4,1.2,"sawtooth",0.1);}
let scene="menu";
function setScene(n){if(scene===n)return;scene=n;mstep=0;if(ac&&bgmOn)nextT=ac.currentTime+0.08;}
function se(){if(!ac||!bgmOn)return;const t=ac.currentTime;tone(880,t,0.07,"square",0.12);tone(1320,t+0.05,0.09,"square",0.1);}
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("#opts button"))se();},true);
function sched(){while(nextT<ac.currentTime+0.25){const T=TRACKS[scene];T.play(mstep,nextT);nextT+=T.len;mstep=(mstep+1)%64;}}
function bgmStart(){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
  if(!ac){ac=new AC();master=ac.createGain();master.gain.value=0.35;master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  ac.resume();mstep=0;nextT=ac.currentTime+0.05;timer=setInterval(sched,50);
}
$("bgm").onclick=()=>{
  bgmOn=!bgmOn;
  if(bgmOn)bgmStart();else clearInterval(timer);
  $("bgm").textContent=bgmOn?"🔊 音：ON":"🔇 音：OFF";
};
document.addEventListener("visibilitychange",()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(bgmOn)ac.resume();});

select();
</script>
